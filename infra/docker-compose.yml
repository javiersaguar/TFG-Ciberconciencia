name: tfg-ciberconciencia

services:

  redpanda:

    image: redpandadata/redpanda:v25.2.1
    container_name: redpanda
    profiles: ["core"]
    command:
      - redpanda
      - start
      - --smp=2
      - --memory=2G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"      # Kafka API (desde tu host / apps)
      - "9644:9644"      # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 10s
      retries: 10

  console:
    image: redpandadata/console:v3.1.0
    container_name: redpanda-console
    profiles: ["core"]
    depends_on:
      - redpanda
    ports:
      - "8080:8080"      # interfaz web de la consola
    environment:
      KAFKA_BROKERS: "redpanda:29092"
  flink-jobmanager:
    image: apache/flink:2.2.1-java17
    container_name: flink-jobmanager
    profiles: ["stream"]
    command: jobmanager
    ports:
      - "8081:8081"      # UI web de Flink
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        table.exec.source.idle-timeout: 5s
    volumes:
      - ./flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:/opt/flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar
      - ./flink/jobs:/opt/jobs
      - flink_data:/opt/flink/data


  flink-taskmanager:
    image: apache/flink:2.2.1-java17
    container_name: flink-taskmanager
    profiles: ["stream"]
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 3g
        table.exec.source.idle-timeout: 5s
    volumes:
      - ./flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:/opt/flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar
      - ./flink/jobs:/opt/jobs

volumes:
  redpanda_data:
  flink_data: