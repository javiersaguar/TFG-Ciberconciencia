name: tfg-ciberconciencia

services:

  redpanda:

    image: redpandadata/redpanda:v25.2.1
    container_name: redpanda
    profiles: ["core"]
    command:
      - redpanda
      - start
      - --smp=2
      - --memory=2G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"      # Kafka API (desde tu host / apps)
      - "9644:9644"      # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 10s
      retries: 10

  console:
    image: redpandadata/console:v3.1.0
    container_name: redpanda-console
    profiles: ["core"]
    depends_on:
      - redpanda
    ports:
      - "8080:8080"      # interfaz web de la consola
    environment:
      KAFKA_BROKERS: "redpanda:29092"
  flink-jobmanager:
    image: apache/flink:2.2.1-java17
    container_name: flink-jobmanager
    profiles: ["stream"]
    command: jobmanager
    ports:
      - "8081:8081"      # UI web de Flink
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        table.exec.source.idle-timeout: 5s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ./flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:/opt/flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar
      - ./flink/jobs:/opt/jobs
      - flink_data:/opt/flink/data


  flink-taskmanager:
    image: apache/flink:2.2.1-java17
    container_name: flink-taskmanager
    profiles: ["stream"]
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 3g
        table.exec.source.idle-timeout: 5s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ./flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:/opt/flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar
      - ./flink/jobs:/opt/jobs

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: clickhouse
    profiles: ["store"]
    ports:
      - "8123:8123"      # HTTP (consultas, UI)
      - "9000:9000"      # cliente nativo
    environment:
      CLICKHOUSE_DB: tfg
      CLICKHOUSE_USER: tfg
      CLICKHOUSE_PASSWORD: tfg
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:11.5.1
    container_name: grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: mlflow
    profiles: ["mlops"]
    ports:
     - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts

  # Grafo de conocimiento (F4.1, adelantado desde F5.1): ATT&CK y CTI en STIX, y despues el Pilar B.
  # Version 5.26 LTS fijada. GDS y APOC se descargan al arrancar en la version compatible con esta
  # imagen (plugins de la edicion Community). Interfaz: http://localhost:7474  (neo4j / tfg-neo4j)
  neo4j:
    image: neo4j:5.26.31-community
    container_name: neo4j
    profiles: ["graph"]
    ports:
      - "127.0.0.1:7474:7474"   # navegador web
      - "127.0.0.1:7687:7687"   # Bolt (drivers)
    environment:
      NEO4J_AUTH: neo4j/tfg-neo4j
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
      NEO4J_dbms_usage__report_enabled: "false"   # sin telemetría al fabricante
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p tfg-neo4j 'RETURN 1' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # OpenCTI (F4.2): plataforma CTI para compararla con la carga directa a Neo4j (plan B).
  # Version fijada (7.261023.1, edicion Community, Apache 2.0) y dependencias con version fija.
  # NO usar las etiquetas -lts: son la edicion LTS de Filigran y exigen una licencia propia.
  # Secretos en infra/.env (ignorado por git; plantilla en infra/.env.example).
  # Solo la interfaz se publica: http://localhost:8082. El resto vive en la red interna
  # (MinIO NO publica el 9000, que es de ClickHouse).
  # ATT&CK: el conector de MITRE apunta a la MISMA v19.2 que el plan B; Mobile, ICS y
  # CAPEC desactivados. Solo funciones de la edicion Community.
  # ---------------------------------------------------------------------------
  opencti-redis:
    image: redis:8.10.1
    container_name: opencti-redis
    profiles: ["cti"]
    volumes:
      - opencti_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  opencti-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.21
    container_name: opencti-elasticsearch
    profiles: ["cti"]
    environment:
      - discovery.type=single-node
      - xpack.ml.enabled=false
      - xpack.security.enabled=false
      - thread_pool.search.queue_size=5000
      - logger.org.elasticsearch.discovery=ERROR
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opencti_es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 50

  opencti-minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: opencti-minio
    profiles: ["cti"]
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - opencti_s3:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  opencti-rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: opencti-rabbitmq
    profiles: ["cti"]
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-}
      - RABBITMQ_NODENAME=rabbit01@localhost
    volumes:
      - ./opencti/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - opencti_amqp:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  opencti:
    image: opencti/platform:7.261023.1
    container_name: opencti
    profiles: ["cti"]
    environment:
      - NODE_OPTIONS=--max-old-space-size=6144
      - APP__PORT=8080
      - APP__BASE_URL=http://localhost:8082
      - APP__ADMIN__EMAIL=${OPENCTI_ADMIN_EMAIL:-}
      - APP__ADMIN__PASSWORD=${OPENCTI_ADMIN_PASSWORD:-}
      - APP__ADMIN__TOKEN=${OPENCTI_ADMIN_TOKEN:-}
      - APP__ENCRYPTION_KEY=${OPENCTI_ENCRYPTION_KEY:-}
      - APP__HEALTH_ACCESS_KEY=${OPENCTI_HEALTHCHECK_ACCESS_KEY:-}
      - APP__TELEMETRY__FILIGRAN__ENABLED=false
      - REDIS__HOSTNAME=opencti-redis
      - REDIS__PORT=6379
      - ELASTICSEARCH__URL=http://opencti-elasticsearch:9200
      - ELASTICSEARCH__NUMBER_OF_REPLICAS=0
      - MINIO__ENDPOINT=opencti-minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=${MINIO_ROOT_USER:-}
      - MINIO__SECRET_KEY=${MINIO_ROOT_PASSWORD:-}
      - RABBITMQ__HOSTNAME=opencti-rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__PORT_MANAGEMENT=15672
      - RABBITMQ__MANAGEMENT_SSL=false
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER:-}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS:-}
      - SMTP__HOSTNAME=localhost
      - SMTP__PORT=25
      - PROVIDERS__LOCAL__STRATEGY=LocalStrategy
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      opencti-redis:
        condition: service_healthy
      opencti-elasticsearch:
        condition: service_healthy
      opencti-minio:
        condition: service_healthy
      opencti-rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health?health_access_key=${OPENCTI_HEALTHCHECK_ACCESS_KEY:-}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  opencti-worker:
    image: opencti/worker:7.261023.1
    profiles: ["cti"]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:-}
    depends_on:
      opencti:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 2

  opencti-connector-mitre:
    image: opencti/connector-mitre:7.261023.1
    container_name: opencti-connector-mitre
    profiles: ["cti"]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:-}
      - CONNECTOR_ID=${CONNECTOR_MITRE_ID:-}
      - "CONNECTOR_NAME=MITRE ATT&CK"
      - CONNECTOR_SCOPE=tool,report,malware,identity,campaign,intrusion-set,attack-pattern,course-of-action,x-mitre-data-source,x-mitre-data-component,x-mitre-matrix,x-mitre-tactic,x-mitre-collection
      - CONNECTOR_LOG_LEVEL=info
      - MITRE_ENTERPRISE_FILE_URL=https://raw.githubusercontent.com/mitre-attack/attack-stix-data/v19.2/enterprise-attack/enterprise-attack-19.2.json
      - MITRE_MOBILE_ATTACK_FILE_URL=false
      - MITRE_ICS_ATTACK_FILE_URL=false
      - MITRE_CAPEC_FILE_URL=false
      - MITRE_INTERVAL=365
    depends_on:
      opencti:
        condition: service_healthy

  opencti-connector-export-stix:
    image: opencti/connector-export-file-stix:7.261023.1
    container_name: opencti-connector-export-stix
    profiles: ["cti"]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:-}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_STIX_ID:-}
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileStix2
      - CONNECTOR_SCOPE=application/json
    depends_on:
      opencti:
        condition: service_healthy

  opencti-connector-import-stix:
    image: opencti/connector-import-file-stix:7.261023.1
    container_name: opencti-connector-import-stix
    profiles: ["cti"]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:-}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_FILE_STIX_ID:-}
      - CONNECTOR_TYPE=INTERNAL_IMPORT_FILE
      - CONNECTOR_NAME=ImportFileStix
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=false
      - CONNECTOR_SCOPE=application/json,text/xml
      - CONNECTOR_AUTO=true
    depends_on:
      opencti:
        condition: service_healthy

  # Linea base de diccionario de ML-2 (F4.3, LB-a): extrae entidades y tecnicas de un documento.
  opencti-connector-import-document:
    image: opencti/connector-import-document:7.261023.1
    container_name: opencti-connector-import-document
    profiles: ["cti"]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:-}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_DOCUMENT_ID:-}
      - CONNECTOR_TYPE=INTERNAL_IMPORT_FILE
      - CONNECTOR_NAME=ImportDocument
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true
      - CONNECTOR_SCOPE=application/pdf,text/plain,text/html,text/markdown
      - CONNECTOR_AUTO=false
      - CONNECTOR_ONLY_CONTEXTUAL=false
      - IMPORT_DOCUMENT_CREATE_INDICATOR=false
    depends_on:
      opencti:
        condition: service_healthy

  # Portal web (F8): la SPA compilada servida por Caddy (frontend/Dockerfile). Hoy no habla con ningún otro servicio
  # (los datos van dentro de la compilación); cuando exista la API de F6.3, Caddy le reenviará /api.
  portal:
    build:
      context: ../frontend
    image: tfg/portal:local
    container_name: portal
    profiles: ["portal"]
    ports:
      - "127.0.0.1:8090:8080"   # http://localhost:8090 (también desde Windows). No el 4173: es el de vite preview y Playwright
    read_only: true
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
      - /config:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  redpanda_data:
  flink_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
  mlflow_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  opencti_redis:
  opencti_es:
  opencti_s3:
  opencti_amqp:
