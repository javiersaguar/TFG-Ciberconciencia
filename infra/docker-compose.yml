name: tfg-ciberconciencia

services:

  redpanda:

    image: redpandadata/redpanda:v25.2.1
    container_name: redpanda
    profiles: ["core"]
    command:
      - redpanda
      - start
      - --smp=2
      - --memory=2G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"      # Kafka API (desde tu host / apps)
      - "9644:9644"      # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 10s
      retries: 10

  console:
    image: redpandadata/console:v3.1.0
    container_name: redpanda-console
    profiles: ["core"]
    depends_on:
      - redpanda
    ports:
      - "8080:8080"      # interfaz web de la consola
    environment:
      KAFKA_BROKERS: "redpanda:29092"
  flink-jobmanager:
    image: apache/flink:2.2.1-java17
    container_name: flink-jobmanager
    profiles: ["stream"]
    command: jobmanager
    ports:
      - "8081:8081"      # UI web de Flink
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        table.exec.source.idle-timeout: 5s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ./flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:/opt/flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar
      - ./flink/jobs:/opt/jobs
      - flink_data:/opt/flink/data


  flink-taskmanager:
    image: apache/flink:2.2.1-java17
    container_name: flink-taskmanager
    profiles: ["stream"]
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 3g
        table.exec.source.idle-timeout: 5s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ./flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:/opt/flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar
      - ./flink/jobs:/opt/jobs

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: clickhouse
    profiles: ["store"]
    ports:
      - "8123:8123"      # HTTP (consultas, UI)
      - "9000:9000"      # cliente nativo
    environment:
      CLICKHOUSE_DB: tfg
      CLICKHOUSE_USER: tfg
      CLICKHOUSE_PASSWORD: tfg
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:11.5.1
    container_name: grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: mlflow
    profiles: ["mlops"]
    ports:
     - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts

  # Portal web (F8): la SPA compilada servida por Caddy (frontend/Dockerfile). Hoy no habla con ningún otro servicio
  # (los datos van dentro de la compilación); cuando exista la API de F6.3, Caddy le reenviará /api.
  portal:
    build:
      context: ../frontend
    image: tfg/portal:local
    container_name: portal
    profiles: ["portal"]
    ports:
      - "127.0.0.1:8090:8080"   # http://localhost:8090 (también desde Windows). No el 4173: es el de vite preview y Playwright
    read_only: true
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
      - /config:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  redpanda_data:
  flink_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
  mlflow_data: